<div class="auth">
  <mat-card class="auth-card" appearance="raised">
    <mat-card-header class="auth-card__header">
      <mat-card-title> Restaurant Portal </mat-card-title>

      <mat-card-subtitle>
        Log in to manage orders, menus, and stats.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="auth-card__body">
      <form class="form" [formGroup]="loginForm" (ngSubmit)="login()">
        <app-input
          [control]="loginForm.controls.email"
          label="Email Address"
          type="email">
        </app-input>

        <app-input
          [control]="loginForm.controls.password"
          label="Password"
          type="password">
        </app-input>

        <app-button
          variant="raised"
          color="primary"
          type="submit"
          class="form__submit"
          [disabled]="loading"
          >{{ loading ? 'LOGGING IN...' : 'LOGIN' }}</app-button
        >
      </form>
    </mat-card-content>
  </mat-card>
</div>
