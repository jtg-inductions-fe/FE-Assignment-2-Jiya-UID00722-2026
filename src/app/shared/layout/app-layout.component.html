<mat-sidenav-container class="dashboard-layout">
  <mat-sidenav
    [mode]="(isMobile$ | async) ? 'over' : 'side'"
    [opened]="currentSidebarState$ | async"
    class="dashboard-layout__sidebar">
    <app-sidebar></app-sidebar>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
