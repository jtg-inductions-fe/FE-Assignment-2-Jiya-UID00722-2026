<div class="login-container">
  <mat-card class="login-card" appearance="raised">
    <mat-card-header class="login-card__header">
      <mat-card-title>Restaurant Portal</mat-card-title>
      <mat-card-subtitle>
        Log in to manage orders, menus, and stats.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="login-card__content">
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <!-- Email -->
        <mat-form-field appearance="outline" class="login-card__field">
          <mat-label>Email Address</mat-label>

          <input matInput type="email" formControlName="email" />

          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>

          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="login-card__field">
          <mat-label>Password</mat-label>

          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password" />

          <button
            mat-icon-button
            matSuffix
            type="button"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
            (click)="hidePassword = !hidePassword">
            <mat-icon>
              {{ hidePassword ? 'visibility' : 'visibility_off' }}
            </mat-icon>
          </button>

          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>

          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="login-card__button"
          type="submit"
          [disabled]="loading">
          {{ loading ? 'LOGGING IN...' : 'LOGIN' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
