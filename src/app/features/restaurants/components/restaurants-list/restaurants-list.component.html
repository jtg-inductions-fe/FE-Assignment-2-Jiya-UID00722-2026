<mat-card>
  <mat-card-content class="restaurants">
    <div class="restaurants__table-wrapper">
      <table mat-table [dataSource]="restaurants" class="restaurants__table">
        <ng-container matColumnDef="restaurantName">
          <th mat-header-cell *matHeaderCellDef class="mat-subtitle-1">
            Restaurant Name
          </th>

          <td mat-cell *matCellDef="let restaurant" class="mat-body-1">
            {{ restaurant.restaurantName }}
          </td>
        </ng-container>

        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef class="mat-subtitle-1">
            Address
          </th>

          <td mat-cell *matCellDef="let restaurant">
            {{ restaurant.address }}
          </td>
        </ng-container>

        <ng-container matColumnDef="owners">
          <th mat-header-cell *matHeaderCellDef class="mat-subtitle-1">
            Owners
          </th>

          <td mat-cell *matCellDef="let restaurant">
            <mat-chip-set>
              <mat-chip *ngFor="let item of restaurant.owners">{{
                item
              }}</mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="mat-subtitle-1">
            Actions
          </th>

          <td mat-cell *matCellDef="let restaurant">
            <app-button
              [variant]="Button.ButtonVariant.stroked"
              [color]="Button.ButtonColor.primary"
              icon="edit"
              [iconSize]="Button.IconSize.sm"
              (click)="editRestaurant(restaurant)">
              Edit
            </app-button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
