<mat-toolbar color="primary" class="header">
  <img
    ngSrc="assets/logo.png"
    width="50"
    height="50"
    alt="Application Logo"
    class="header__logo" />

  <ng-container *ngIf="currentUser$ | async as user">
    <div [matMenuTriggerFor]="userMenu" class="header__avatar-btn">
      <app-avatar [src]="user.avatar"></app-avatar>
    </div>

    <mat-menu #userMenu="matMenu">
      <div class="header__user-details">
        <p>{{ user.name }}</p>
        <p>{{ user.email }}</p>
      </div>

      <mat-divider class="header__menu-divider"></mat-divider>

      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </mat-menu>
  </ng-container>
</mat-toolbar>
