<div [ngSwitch]="variant">
  <!-- Raised Button -->

  <button
    *ngSwitchCase="'raised'"
    mat-raised-button
    [type]="type"
    [disabled]="disabled"
    [color]="color"
    [ngClass]="buttonClasses"
    (click)="onButtonClick($event)">
    <ng-container *ngTemplateOutlet="buttonContentTemplate"></ng-container>
  </button>

  <!-- Flat Button -->

  <button
    *ngSwitchCase="'flat'"
    mat-flat-button
    [type]="type"
    [disabled]="disabled"
    [color]="color"
    [ngClass]="buttonClasses"
    (click)="onButtonClick($event)">
    <ng-container *ngTemplateOutlet="buttonContentTemplate"></ng-container>
  </button>

  <!-- Stroked Button -->
  <button
    *ngSwitchCase="'stroked'"
    mat-stroked-button
    [type]="type"
    [disabled]="disabled"
    [color]="color"
    [ngClass]="buttonClasses"
    (click)="onButtonClick($event)">
    <ng-container *ngTemplateOutlet="buttonContentTemplate"></ng-container>
  </button>

  <!-- 4. Icon Button -->
  <button
    *ngSwitchCase="'icon'"
    mat-icon-button
    [type]="type"
    [disabled]="disabled"
    [color]="color"
    [ngClass]="buttonClasses"
    (click)="onButtonClick($event)">
    <ng-container *ngTemplateOutlet="buttonContentTemplate"></ng-container>
  </button>

  <!-- 5. FAB Button -->
  <button
    *ngSwitchCase="'fab'"
    mat-fab
    [type]="type"
    [disabled]="disabled"
    [color]="color"
    [ngClass]="buttonClasses"
    (click)="onButtonClick($event)">
    <ng-container *ngTemplateOutlet="buttonContentTemplate"></ng-container>
  </button>

  <!-- 6. Mini FAB Button -->
  <button
    *ngSwitchCase="'mini-fab'"
    mat-mini-fab
    [type]="type"
    [disabled]="disabled"
    [color]="color"
    [ngClass]="buttonClasses"
    (click)="onButtonClick($event)">
    <ng-container *ngTemplateOutlet="buttonContentTemplate"></ng-container>
  </button>

  <!-- 7. Basic Button (Default) -->
  <button
    *ngSwitchDefault
    mat-button
    [type]="type"
    [disabled]="disabled"
    [color]="color"
    [ngClass]="buttonClasses"
    (click)="onButtonClick($event)">
    <ng-container *ngTemplateOutlet="buttonContentTemplate"></ng-container>
  </button>
</div>

<ng-template #buttonContentTemplate>
  <span class="button-content">
    <mat-icon *ngIf="icon && iconPosition === 'prefix' && variant !== 'icon'">
      {{ icon }}
    </mat-icon>

    <span *ngIf="label && variant !== 'icon'">
      {{ label }}
    </span>

    <ng-container *ngIf="!label && variant !== 'icon'">
      <ng-content></ng-content>
    </ng-container>

    <mat-icon *ngIf="icon && iconPosition === 'suffix' && variant !== 'icon'">
      {{ icon }}
    </mat-icon>

    <mat-icon
      *ngIf="
        icon &&
        (variant === 'icon' || variant === 'fab' || variant === 'mini-fab')
      ">
      {{ icon }}
    </mat-icon>
  </span>
</ng-template>
