<div class="auth">
  <mat-card class="auth-card" appearance="raised">
    <mat-card-header class="auth-card__header">
      <mat-card-title> Restaurant Portal </mat-card-title>

      <mat-card-subtitle>
        Log in to manage orders, menus, and stats.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="auth-card__body">
      <form class="form" [formGroup]="loginForm" (ngSubmit)="login()">
        <mat-form-field appearance="outline" class="form__field">
          <mat-label>Email Address</mat-label>

          <input matInput type="email" formControlName="email" />

          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>

          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form__field">
          <mat-label>Password</mat-label>

          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password" />

          <app-button
            matSuffix
            variant="icon"
            [icon]="hidePassword ? 'visibility' : 'visibility_off'"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
            (btnClick)="hidePassword = !hidePassword">
          </app-button>

          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>

          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <app-button
          variant="raised"
          color="primary"
          type="submit"
          class="form__submit"
          [disabled]="loading"
          >{{ loading ? 'LOGGING IN...' : 'LOGIN' }}</app-button
        >
      </form>
    </mat-card-content>
  </mat-card>
</div>
